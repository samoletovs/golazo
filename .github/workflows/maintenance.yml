name: Maintenance

on:
  schedule:
    # Weekly: Sunday 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  maintain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run maintenance pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/maintenance/maintain.cjs --verbose

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR with discoveries
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # NOT GITHUB_TOKEN. "Allow GitHub Actions to create and approve pull
          # requests" is off on every repo in the fleet but two, so the default
          # token fails this step with "GitHub Actions is not permitted to create
          # or approve pull requests" — which is what killed this workflow on its
          # very first scheduled run. Enabling that setting would also grant
          # Actions the right to *approve* PRs, which would hollow out the review
          # gate everywhere; a PAT scoped to this repo buys only what is needed.
          # It also means the maintenance PR triggers CI, which a GITHUB_TOKEN PR
          # deliberately does not.
          token: ${{ secrets.GH_PAT }}
          commit-message: 'chore: maintenance run — team discoveries + content updates'
          title: '⚽ Weekly maintenance: team discoveries & data updates'
          body: |
            Automated maintenance run. Changes may include:
            - New team discoveries from federation scanners
            - Exercise video enrichments
            - Content queue status updates
            - Maintenance report

            Review `data/federation-discoveries.json` for new teams.
            Set `status: "approved"` on entries you want to merge into the registry.
          branch: maintenance/weekly-run
          delete-branch: true
          labels: maintenance,automated

      - name: Build summary
        id: summary
        if: always()
        run: |
          if [ -f data/maintenance-report.json ]; then
            ADDED=$(jq '.summary.totalAdded' data/maintenance-report.json)
            ERRORS=$(jq '.summary.totalErrors' data/maintenance-report.json)
            DISCOVERIES=$(jq 'length // 0' data/federation-discoveries.json 2>/dev/null || echo "0")
            echo "message=⚽ golazo maintenance: ${ADDED} added, ${ERRORS} errors, ${DISCOVERIES} total discoveries" >> $GITHUB_OUTPUT
          else
            echo "message=⚽ golazo maintenance completed (no report generated)" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram (success)
        if: success()
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${{ steps.summary.outputs.message }}" \
            || echo "::warning::Telegram notification failed"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          # Which step actually failed. "maintenance FAILED" plus a link means
          # opening a laptop and reading a 500-line log to learn anything at all;
          # the first scheduled run of this workflow sent exactly that and the
          # cause (a permissions setting, not the pipeline) stayed invisible.
          FAILED_STEP: >-
            ${{ steps.changes.outcome == 'failure' && 'change detection'
             || steps.pr.outcome == 'failure' && 'PR creation — check GH_PAT has Pull requests: write'
             || 'the maintenance pipeline (scripts/maintenance/maintain.cjs)' }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=❌ <b>golazo</b> maintenance FAILED
          Failed at: ${FAILED_STEP}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Telegram notification failed"
