name: CI/CD

on:
  workflow_dispatch:
    inputs:
      delivery_pr:
        description: 'Recover production delivery for one already merged PR (default branch only)'
        required: false
        type: string
  workflow_run:
    workflows: ["Auto-merge Dependabot PRs", "Auto-merge Copilot PRs"]
    types: [completed]
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && !inputs.delivery_pr && '-manual' || '' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action != 'closed')
    outputs:
      source: ${{ steps.delivery.outputs.source || github.sha }}
      pr: ${{ steps.delivery.outputs.pr }}
      merge: ${{ steps.delivery.outputs.merge }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve confirmed bot merge from trusted default-branch code
        id: delivery
        if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.delivery_pr)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/merged-pr-delivery.py resolve

      - name: Check out the current merged production source
        if: steps.delivery.outputs.source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.delivery.outputs.source }}
          persist-credentials: false

      - name: Test merged-PR delivery policy
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: python tests/test_merged_pr_delivery.py

      - name: Test design evidence enforcement
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: python tests/test_design_gate.py

      - name: Require source-bound evidence for UI changes
        if: github.event_name == 'pull_request'
        env:
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-design-pr.py --repo . --base "$DESIGN_BASE_SHA"

      - uses: actions/setup-node@v5
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npm ci

      - name: Install the locked API for its production runtime
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npm ci --prefix api --engine-strict

      - name: Test real SDK compatibility and API registration
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npm test --prefix api

      - name: Lint
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npm run lint

      - name: Type check
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npx tsc --noEmit

      - name: Test
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npm test

      - name: Validate football terminology
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: npm run validate:football-terms

      - name: Build source-stamped frontend
        id: validation_build
        if: github.event_name != 'workflow_run' || steps.delivery.outputs.pr
        run: |
          npm run build
          cp staticwebapp.config.json dist/
          git rev-parse HEAD > dist/source-revision.txt

      - name: Save exact-source validation preview
        if: github.event_name == 'workflow_dispatch' && steps.validation_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: golazo-preview-${{ steps.delivery.outputs.source || github.sha }}
          path: dist/
          retention-days: 7

  deploy:
    needs: quality
    permissions:
      contents: read
      pull-requests: write
      actions: read
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
       || ((github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && needs.quality.outputs.pr))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.actor != 'dependabot[bot]' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.quality.outputs.source }}
          submodules: true
          lfs: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend with the tested runtime
        run: |
          npm ci
          npm run build
          cp staticwebapp.config.json dist/
          git rev-parse HEAD > dist/source-revision.txt

      - name: Install the locked production API
        run: npm ci --prefix api --omit=dev --engine-strict

      - name: Refuse an obsolete production source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SOURCE: ${{ needs.quality.outputs.source }}
        run: python scripts/merged-pr-delivery.py current --source "$CHECKED_SOURCE"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Prepare verified merged preview cleanup
        id: cleanup
        if: needs.quality.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_PR: ${{ needs.quality.outputs.pr }}
          MERGE_SHA: ${{ needs.quality.outputs.merge }}
        run: python scripts/merged-pr-delivery.py cleanup --pr "$MERGED_PR" --merge "$MERGE_SHA"

      - name: Close the confirmed merged PR preview
        if: needs.quality.outputs.pr
        timeout-minutes: 5
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_SWA_TOKEN }}
          CLEANUP_EVENT: ${{ steps.cleanup.outputs.event_path }}
        run: |
          set -euo pipefail
          : "${DEPLOYMENT_TOKEN:?SWA token is required for verified preview cleanup}"
          docker run --rm --env DEPLOYMENT_TOKEN --env DEPLOYMENT_PROVIDER=GitHub \
            --volume "$GITHUB_WORKSPACE:/github/workspace:ro" \
            --entrypoint /bin/staticsites/StaticSitesClient \
            mcr.microsoft.com/appsvc/staticappsclient:stable close --event "$CLEANUP_EVENT"

      - name: Notify Telegram (success)
        if: success() && github.event_name == 'push'
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=✅ <b>golazo</b> deployed
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          SHA: ${{ github.sha }}" \
            || echo "::warning::Telegram notification failed"

      - name: Notify Telegram (failure)
        if: failure() && github.event_name == 'push'
        env:
          NAURO_BOT_TOKEN: ${{ secrets.NAURO_BOT_TOKEN }}
          NAURO_CHAT_ID: ${{ secrets.NAURO_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$NAURO_BOT_TOKEN" ] && { echo "NAURO_BOT_TOKEN not set; skipping"; exit 0; }
          COMMIT_MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          curl -sf -X POST "https://api.telegram.org/bot${NAURO_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${NAURO_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=❌ <b>golazo</b> deploy FAILED
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Telegram notification failed"

      - name: Sync landing page order
        if: success() && github.event_name == 'push'
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/samoletovs/naurolabs/dispatches \
            -d '{"event_type": "project-deployed", "client_payload": {"project": "golazo"}}' \
            || echo "::warning::Landing page sync dispatch failed"

  close_pull_request:
    # Fork PRs get a read-only token and no secrets, so the SWA token is empty
    # and this job could only fail for them. Phrased negatively on purpose:
    # github.event.pull_request is null on push/workflow_run, so a bare
    # `head.repo.full_name == github.repository` reads false there and would
    # disable deployment entirely. This constrains pull_request events only.
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: close
          app_location: /
